# ====================================================================
# PIPELINE DE INTEGRAÇÃO CONTÍNUA (CI/CD) E QUALIDADE (QA)
# Responsável: Guilherme (Inteligência Artificial, DevOps & QA)
# ====================================================================

name: Portal FATEC RC — CI/CD & QA Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  USE_MOCK_DB: 'true'
  USE_MOCK_AI: 'true'
  JWT_SECRET: fatec_rio_claro_super_secure_jwt_secret_key_2026_ci_runner

jobs:
  quality-and-tests:
    name: Build, Seguranca, IA Gemini & QA
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Instalar Dependências
        run: npm ci

      - name: 4. Executar Testes Unitários de Backend e Segurança
        run: npm run test:backend

      - name: 5. Executar Teste de Conectividade SDK Google Gemini
        run: npm run test:ai

      - name: 6. Executar Esteira Integrada de QA e Auditoria DevOps
        run: npm run test:qa

      - name: 7. Validar Build de Produção Next.js (Prontidão Vercel)
        run: npm run build
